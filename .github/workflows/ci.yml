name: CI RAG banque

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Lint (G1)
        run: ruff check .

      - name: Tests, data, provenance, access, injection, regression (G1-G6, G8)
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Security - Bandit (G7)
        run: bandit -r src scripts

      # Exceptions documentees dans docs/risk_report.md (section "Exceptions pip-audit").
      # PYSEC-2026-1845 : pytest (dependance de test). Les 4 identifiants chromadb sont a ANALYSER
      # (lire les avis sur osv.dev) avant de garder cette exception.
      - name: Security - pip-audit (G7)
        run: >
          pip-audit
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
