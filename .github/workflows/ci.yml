name: CI RAG banque

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Qualité : lint, tests, couverture et sécurité
  # ------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Install DVC with Google Drive support
        run: |
          python -m pip install "dvc[gdrive]"
          python -m pip check

      - name: Pull Data with DVC
        run: dvc pull data/raw.dvc
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Security - Bandit
        run: bandit -r src scripts

      - name: Security - pip-audit
        run: |
          pip-audit \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  # ------------------------------------------------------------------
  # 2. Development : construction de l'index et smoke test
  # ------------------------------------------------------------------
  development:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install DVC with Google Drive support
        run: |
          python -m pip install "dvc[gdrive]"
          python -m pip check

      - name: Pull Data with DVC
        run: dvc pull data/raw.dvc
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

      - name: Build index (config A)
        run: python -m scripts.build_index --config A --no-mlflow

      - name: Smoke test
        run: python -m src.app --role agent --question "Quel est le plafond de retrait de la carte Premium ?"

  # ------------------------------------------------------------------
  # 3. Staging : évaluation et quality gates
  # ------------------------------------------------------------------
  staging:
    needs: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install DVC with Google Drive support
        run: |
          python -m pip install "dvc[gdrive]"
          python -m pip check

      - name: Pull Data with DVC
        run: dvc pull data/raw.dvc
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}

      - name: Evaluation (47 questions)
        run: python -m scripts.run_eval --config A --no-mlflow

      - name: Quality gates
        run: python -m scripts.promote --config A

      - name: Archive evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

  # ------------------------------------------------------------------
  # 4. Production : promotion du modèle validé
  # Configurer Required reviewers dans l'environnement GitHub production.
  # ------------------------------------------------------------------
  production:
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download validated evaluation results
        uses: actions/download-artifact@v4
        with:
          name: eval-results
          path: eval/results/

      - name: Promote champion
        run: python -m scripts.promote --config A --approve

      - name: Archive promotion decision
        uses: actions/upload-artifact@v4
        with:
          name: champion
          path: eval/results/champion.json
