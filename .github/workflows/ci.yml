name: CI RAG banque

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Qualité : lint, tests, couverture et sécurité
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt

      - name: Install DVC with compatible Google Drive dependencies
        run: |
          python -m pip install \
            "dvc[gdrive]" \
            "pyOpenSSL==24.2.1" \
            "cryptography==43.0.3" \
            "asyncssh==2.19.0"
          python -m pip check

      - name: Verify OpenSSL imports
        run: |
          python -c "from OpenSSL import crypto; print('OK: OpenSSL import succeeded')"

      - name: Verify Google Drive secret
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          if [ -z "$GDRIVE_CREDENTIALS_DATA" ]; then
            echo "::error::GDRIVE_CREDENTIALS_DATA is absent or empty."
            echo "Check Repository secrets and Environment secrets."
            exit 1
          fi

          printf '%s' "$GDRIVE_CREDENTIALS_DATA" |
            python -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,dict), 'JSON must be an object'; print('OK: secret is present and contains valid JSON')"

      - name: Pull Data with DVC
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc pull data/raw.dvc

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Security - Bandit
        run: bandit -r src scripts

      - name: Security - pip-audit
        # Des vulnérabilités sont ignorées volontairement. Voir SECURITY.md
        # pour la justification (versions verrouillées par pydrive2 / DVC gdrive).
        run: |
          pip-audit \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-2268 \
            --ignore-vuln PYSEC-2026-2269 \
            --ignore-vuln PYSEC-2026-1284 \
            --ignore-vuln PYSEC-2026-2141 \
            --ignore-vuln PYSEC-2026-35 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-3808 \
            --ignore-vuln PYSEC-2026-4026 \
            --ignore-vuln PYSEC-2026-2447

  # 2. Development : construction de l'index et smoke test
  development:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install DVC with compatible Google Drive dependencies
        run: |
          python -m pip install \
            "dvc[gdrive]" \
            "pyOpenSSL==24.2.1" \
            "cryptography==43.0.3" \
            "asyncssh==2.19.0"
          python -m pip check

      - name: Verify OpenSSL imports
        run: |
          python -c "from OpenSSL import crypto; print('OK: OpenSSL import succeeded')"

      - name: Verify Google Drive secret
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          if [ -z "$GDRIVE_CREDENTIALS_DATA" ]; then
            echo "::error::GDRIVE_CREDENTIALS_DATA is absent or empty in development."
            exit 1
          fi

          printf '%s' "$GDRIVE_CREDENTIALS_DATA" |
            python -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,dict), 'JSON must be an object'; print('OK: secret is present and contains valid JSON')"

      - name: Pull Data with DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: dvc pull data/raw.dvc

      - name: Build index (config A)
        run: python -m scripts.build_index --config A --no-mlflow

      - name: Smoke test
        run: python -m src.app --role agent --question "Quel est le plafond de retrait de la carte Premium ?"

  # 3. Staging : évaluation et quality gates
  staging:
    needs: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install DVC with compatible Google Drive dependencies
        run: |
          python -m pip install \
            "dvc[gdrive]" \
            "pyOpenSSL==24.2.1" \
            "cryptography==43.0.3" \
            "asyncssh==2.19.0"
          python -m pip check

      - name: Verify OpenSSL imports
        run: |
          python -c "from OpenSSL import crypto; print('OK: OpenSSL import succeeded')"

      - name: Verify Google Drive secret
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          if [ -z "$GDRIVE_CREDENTIALS_DATA" ]; then
            echo "::error::GDRIVE_CREDENTIALS_DATA is absent or empty in staging."
            exit 1
          fi

          printf '%s' "$GDRIVE_CREDENTIALS_DATA" |
            python -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,dict), 'JSON must be an object'; print('OK: secret is present and contains valid JSON')"

      - name: Pull Data with DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: dvc pull data/raw.dvc

      - name: Evaluation (47 questions)
        run: python -m scripts.run_eval --config A --no-mlflow

      - name: Quality gates
        run: python -m scripts.promote --config A

      - name: Archive evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

  # 4. Production : promotion du modèle validé
  production:
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Download validated evaluation results
        uses: actions/download-artifact@v4
        with:
          name: eval-results
          path: eval/results/

      - name: Promote champion
        run: python -m scripts.promote --config A --approve

      - name: Archive promotion decision
        uses: actions/upload-artifact@v4
        with:
          name: champion
          path: eval/results/champion.json